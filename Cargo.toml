[package]
name        = "datom-codec"
version     = "0.32.2"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/LiGoldragon/datom-codec"
description = "Datomic: positional typed data over Protos."
publish     = false

[workspace]
members = ["crates/datom-codec-derive"]

[features]
# Every generated ethos contract archives its types. `Decimal` and `Meaning`
# back intrinsics, and `Error` is what a contract holds where a datom reading
# fails, so their rkyv derives live behind this feature, which also archives
# the protos error an `Error` carries. A Nexus enables it without enabling
# its contract's `datom` feature.
rkyv = ["dep:rkyv", "protos/rkyv"]

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"], optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
derive = { package = "datom-codec-derive", path = "crates/datom-codec-derive" }

[dev-dependencies]
proptest = "1.6"

[[test]]
name = "archival"
path = "tests/archival.rs"
required-features = ["rkyv"]

[lib]
name = "datom_codec"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
