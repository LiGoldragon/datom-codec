[package]
name        = "datom-codec"
version     = "0.19.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/LiGoldragon/datom-codec"
description = "Datomic: positional typed data over Protos."
publish     = false

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "8cf5df1c1ece" }

[dev-dependencies]
proptest = "1.6"

[lib]
name = "datom_codec"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[[test]]
name = "scale"
harness = false
