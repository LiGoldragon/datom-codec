[package]
name        = "datomic"
version     = "0.7.1"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/LiGoldragon/datomic"
description = "Datomic positional typed data over Protos Portion."
publish     = false

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "bfde3b878dd3de2991d7f605b59f57a13ef8f20b" }

[lib]
name = "datomic"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
