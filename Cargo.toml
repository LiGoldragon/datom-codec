[package]
name        = "datom-codec"
version     = "0.21.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/LiGoldragon/datom-codec"
description = "Datomic: positional typed data over Protos."
publish     = false

[workspace]
members = ["crates/datom-codec-derive"]

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "12739e22df25" }
derive = { package = "datom-codec-derive", path = "crates/datom-codec-derive" }

[dev-dependencies]
proptest = "1.6"

[lib]
name = "datom_codec"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
