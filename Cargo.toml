[package]
name        = "datomic"
version     = "0.12.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/LiGoldragon/datomic"
description = "Datomic: positional typed data over Protos."
publish     = false

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3b29b61e431b" }

[dev-dependencies]
proptest = "1.6"

[lib]
name = "datomic"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
